schemas:
  RestaurantRequest:
    name: "Ресторант Централ"
    description: "Уютен ресторант в центъра на града"
    address: "бул. Витоша 10"
    city: "София"
    country: "България"
    phone: "+35929001234"
    email: "central@example.com"
    openingTime: "10:00:00"
    closingTime: "23:00:00"
    locations:
      INSIDE:
        - tableNumber: "A1"
          capacity: 4
        - tableNumber: "A2"
          capacity: 2
        - tableNumber: "A3"
          capacity: 2
        - tableNumber: "A4"
          capacity: 6
        - tableNumber: "A5"
          capacity: 4
      SUMMER_GARDEN:
        - tableNumber: "B1"
          capacity: 6
        - tableNumber: "B2"
          capacity: 4
        - tableNumber: "B3"
          capacity: 4
        - tableNumber: "B4"
          capacity: 2
  TableRequest:
    tableNumber: "A1"
    capacity: 4
    location: "INSIDE"
  ReviewRequest:
    reservationId: 1
    rating: 5
    comment: "Страхотно място, определено ще се върнем!"

paths:
  /api/restaurants:
    get:
      city: "София"
  /api/restaurants/{id}:
    get:
      id: 16
    put:
      id: 16
    delete:
      id: 16
  /api/restaurants/{id}/tables:
    post:
      id: 16
    get:
      id: 16
  /api/restaurants/{id}/available-time-slots:
    get:
      id: 16
      date: "2026-05-10"
      guestsCount: 2
  /api/restaurants/{id}/hours:
    put:
      id: 16
      openingTime: "09:00:00"
      closingTime: "23:00:00"
  /api/restaurants/{id}/locations:
    get:
      id: 16
  /api/restaurants/{id}/locations/{location}/toggle:
    put:
      id: 16
      location: "SUMMER_GARDEN"
      enabled: true
  /api/restaurants/{restaurantId}/tables/{tableNumber}/availability:
    put:
      restaurantId: 16
      tableNumber: "Л7"
      available: true
  /api/restaurants/{restaurantId}/reviews:
    post:
      restaurantId: 16
    get:
      restaurantId: 16

spring:
  application:
    name: reservation-service-v2
  datasource:
    url: jdbc:postgresql://localhost:5432/quicktable_reservations_v2
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

server:
  port: 8085

management:
  endpoints:
    web:
      exposure:
        include: health,info,scheduledtasks,metrics
  endpoint:
    health:
      show-details: when-authorized

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000

restaurant-service:
  url: http://localhost:8082

user-service:
  url: http://localhost:8081

notification-service:
  url: http://localhost:3001

scheduler:
  reminders:
    enabled: true
    cron: "0 0,30 * * * *"
  day-before-reminder:
    enabled: true
    cron: "0 0,30 * * * *"
  auto-complete:
    enabled: true
    cron: "0 */30 * * * *"
    hours-after: 3
  no-show:
    enabled: true
    cron: "0 15 * * * *"
    hours-after: 1
  review-request:
    enabled: true
    cron: "0 0 10 * * *"

app:
  base-url: http://localhost:3000

logging:
  level:
    com.quicktable: DEBUG
